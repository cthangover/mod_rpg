rpg/ui/walk_click = WASD / стрелки — идти; левый клик — проложить путь. E / F — взаимодействие.
rpg/ui/click_searching = Ищу путь… WASD или Esc отменяют цель.
rpg/ui/click_walking = Иду по пути. WASD, E / F или Esc отменяют цель.
rpg/ui/click_blocked = Клетка назначения занята. Выберите другую клетку или идите с WASD.
rpg/ui/click_unreachable = Пути к этой клетке сейчас нет. Выберите другую клетку или идите с WASD.
rpg/ui/click_budget = Достигнут предел поиска. Выберите клетку поближе или идите с WASD.
rpg/ui/click_invalid = Эта клетка находится за границей карты.
