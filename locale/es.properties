mod_rpg_name = Mundo RPG
mod_rpg_desc = Un mundo de tiles que se recorre a pie, al estilo de RPG Maker: movimiento por cuadrícula con WASD, eventos con E/F, teletransportes, encuentros aleatorios; un mapa es una escena cualquiera del juego.

rpg/ui/no_renderer=No hay un renderizador de mapas. Revisa los mods del juego.
