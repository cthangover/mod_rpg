rpg/ui/walk_click = WASD / arrows to walk; left click for a route. E / F to interact.
rpg/ui/click_searching = Looking for a route… WASD or Esc cancels.
rpg/ui/click_walking = Following the route. WASD, E / F or Esc cancels.
rpg/ui/click_blocked = That destination is blocked. Choose another cell or use WASD.
rpg/ui/click_unreachable = No route to that cell in the current world. Choose another cell or use WASD.
rpg/ui/click_budget = Route search reached its limit. Choose a nearer cell or use WASD.
rpg/ui/click_invalid = That cell is outside the map.
