rpg/data_check/quad_count = A quad needs exactly four corners.
rpg/data_check/quad_number = Each corner needs three finite numbers in world cells.
rpg/data_check/quad_area = The quad has zero or nonfinite area in 3D.
rpg/data_check/quad_affine = The fourth corner does not form an affine quad; tolerance depends on edge lengths.
rpg/data_check/vector = Two finite numbers in world cells are required. Negative offsets are valid.
rpg/data_check/size = Size must be positive and finite, in world cells.
rpg/data_check/scale = Scale must be finite and between 0.01 and 100.
rpg/data_check/crop = Crop uses integer pixels [x, y, w, h] inside the picture.
rpg/data_check/material = A surface material must be a square matching the map PatchSize.
rpg/data_check/image = The named picture is missing or unreadable.
rpg/data_check/sheet = Walking sheet dimensions or metadata do not match its layout.
rpg/data_check/part = Each part must be a JSON object; the parts list may be empty.
rpg/data_check/duplicate_part = Nonempty part IDs must be unique for unambiguous keyed merging.
rpg/data_check/enum = The field contains an unknown enum value.
rpg/data_check/projection = Additional projection: this check does not confirm its provider.
rpg/data_check/map_size = Map and pixel-grid sizes must be positive integers.
rpg/data_check/map_rows = Explicit layer rows must match the map width and height.
rpg/data_check/reference = A used resource is missing. Unused legend entries are excluded.
rpg/data_check/layer_form = The object form does not fit the map layer.
rpg/data_check/json = The input could not be read; the audit is incomplete.
rpg/data_check/budget = The map exceeds the 16,384-cell audit budget. This is not a map format restriction.
rpg/data_check/unknown = Unknown validation rule.
