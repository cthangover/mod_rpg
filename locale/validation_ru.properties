rpg/data_check/quad_count = Нужны ровно четыре угла quad.
rpg/data_check/quad_number = Каждый угол содержит три конечных числа в клетках мира.
rpg/data_check/quad_area = Quad имеет нулевую или нечисловую площадь в 3D.
rpg/data_check/quad_affine = Четвёртый угол не образует аффинный quad; допуск задан длиной рёбер.
rpg/data_check/vector = Нужны два конечных числа в клетках мира. Отрицательные смещения допустимы.
rpg/data_check/size = Размер должен быть положительным и конечным, в клетках мира.
rpg/data_check/scale = Масштаб должен быть конечным числом от 0.01 до 100.
rpg/data_check/crop = Обрезка задаётся целыми пикселями [x, y, w, h] внутри картинки.
rpg/data_check/material = Материал поверхности должен быть квадратом размера PatchSize карты.
rpg/data_check/image = Указанная картинка не найдена или не читается.
rpg/data_check/sheet = Метаданные или размер листа ходьбы не соответствуют его раскладке.
rpg/data_check/part = Часть должна быть объектом JSON; список частей может быть пустым.
rpg/data_check/duplicate_part = Непустые Id частей должны различаться для однозначного объединения.
rpg/data_check/enum = Поле содержит неизвестное значение перечисления.
rpg/data_check/projection = Дополнительная проекция: наличие её провайдера этой проверкой не подтверждено.
rpg/data_check/map_size = Размеры карты и пиксельной сетки должны быть положительными целыми числами.
rpg/data_check/map_rows = Явно заданные строки слоя должны совпадать с шириной и высотой карты.
rpg/data_check/reference = Используемый ресурс не найден. Неиспользуемая легенда сюда не входит.
rpg/data_check/layer_form = Форма объекта не соответствует слою карты.
rpg/data_check/json = Данные не прочитаны; проверка не завершена.
rpg/data_check/budget = Карта превышает бюджет проверки: 16 384 клетки. Это не запрет формата карты.
rpg/data_check/unknown = Неизвестное правило проверки.
